<!DOCTYPE html>
<html lang="pt-BR">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retornando…</title></head>
<body style="font-family:-apple-system,'Segoe UI',Roboto,sans-serif;background:#faf9f7;display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;margin:0">
<div style="background:#fff;border:1px solid #eee2d9;border-radius:16px;max-width:560px;width:100%;padding:40px 28px;text-align:center;box-shadow:0 8px 30px rgba(0,0,0,.06)">
  <h1 id="t" style="font-size:1.2rem;margin-bottom:10px">Processando…</h1>
  <p id="msg" style="color:#5c5c5c;font-size:.9rem;line-height:1.5"></p>
  <div id="box" style="display:none;background:#f0ede8;border-radius:8px;padding:12px;margin-top:10px;word-break:break-all;font-size:.72rem;text-align:left;color:#333"></div>
</div>
<script>
(async function(){
  const q = new URLSearchParams(location.search);
  const code = q.get("code") || "";
  const err  = q.get("error") || "";
  const box = document.getElementById("box");
  if (err) {
    document.getElementById("t").textContent = "O fluxo não terminou";
    document.getElementById("msg").textContent = "Erro reportado pela Meta: " + (q.get("error_description")||err) + ". Volte e tente de novo.";
    return;
  }
  if (!code) {
    document.getElementById("t").textContent = "Sem código na URL";
    document.getElementById("msg").textContent = "Abra esta página só pelo botão da ativação.";
    return;
  }
  document.getElementById("msg").textContent = "Código recebido. Enviando ao servidor do Jarvis…";
  try {
    // IMPORTANTE: troca do code (config_id/Embedded Signup) NÃO leva redirect_uri
    const r = await fetch("https://wa-webhook.felipe-sanches.workers.dev/oauth/capture", {
      method: "POST", headers: {"Content-Type":"application/json"},
      body: JSON.stringify({ code: code, secret: "958d6db7767405c12572bd099d4cd939", ts: Date.now() })
    });
    const j = await r.json();
    if (j.ok) {
      document.getElementById("t").textContent = "Pronto! ✅";
      document.getElementById("msg").innerHTML = "<strong>Pode fechar esta página. O Jarvis já pegou o token e continua daqui.</strong>";
    } else {
      document.getElementById("t").textContent = "O código chegou, mas a troca falhou";
      document.getElementById("msg").innerHTML = "O Jarvis já foi avisado do erro e vai corrigir. Pode fechar esta página.";
    }
    box.style.display = "block"; box.textContent = JSON.stringify(j);
  } catch(e) {
    document.getElementById("t").textContent = "Falha no envio automático";
    document.getElementById("msg").innerHTML = "Copie o código abaixo e cole no chat do Jarvis:";
    box.style.display = "block"; box.textContent = code;
  }
})();
</script>
</body>
</html>
